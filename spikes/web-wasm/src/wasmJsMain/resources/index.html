<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current (C: Compose Wasm)</title>
    <style>
        html, body { margin: 0; height: 100%; background: #111318; overflow: hidden; }
        /* The player's <video> lives behind the Compose canvas; the player screen draws no background, so it shows through. */
        #video-layer { position: fixed; inset: 0; z-index: 0; background: #000; display: none; }
        #video-layer video { width: 100%; height: 100%; display: block; }
        #compose-root { position: fixed; inset: 0; z-index: 1; }
        /* Link overlays: transparent, but focusable and visible when focused from the keyboard. */
        .c-link { display: block; width: 100%; height: 100%; border-radius: 8px; }
        .c-link:focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }
        /* The sign-in form is real HTML, styled like the Compose page around it. */
        .c-form { height: 100%; display: flex; flex-direction: column; gap: 12px; color-scheme: dark;
                  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .c-form label { display: flex; flex-direction: column; gap: 4px; color: #9aa0ad; font-size: 14px; }
        .c-form input { font: inherit; font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #333846; background: #1c1f26; color: #e8e9ee; }
        .c-form button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #5b8def; background: #5b8def; color: #fff; cursor: pointer; }
        .c-form :focus-visible { outline: 2px solid #5b8def; outline-offset: 2px; }
    </style>
</head>
<body>
<div id="video-layer"></div>
<div id="compose-root"></div>
<script src="/web-wasm.js"></script>
</body>
</html>
