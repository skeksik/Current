name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned by commit SHA, with the tag they were taken from in a comment.
permissions:
  contents: read

# A newer push to a PR branch cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Tests, web, Android (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: ./scripts/check-no-team-id.sh
      - run: ./scripts/check-apple-version.sh
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - run: ./gradlew jvmTest :web:jsNodeTest :desktopApp:classes
      - name: Web app (npm licences, Kotlin library, Vite build)
        working-directory: webApp
        run: |
          npm ci
          npm run licences
          npm run build
      - run: ./gradlew :androidApp:assembleDebug
      - run: ./scripts/check-android-apk.sh
      - name: Secret Service store (GNOME Keyring in a D-Bus session, ADR 0017)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring libsecret-1-0 dbus-daemon
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets > /dev/null && CURRENT_TEST_SECRET_SERVICE=1 ./gradlew :core:database:jvmTest --tests "*KeyringTest" --rerun'
          # The test ran rather than being skipped: a passed test case has no child element (a skipped one holds <skipped/>).
          grep -q '<testcase name="linuxSecretService" [^>]*/>' core/database/build/test-results/jvmTest/TEST-com.skeksik.current.core.database.KeyringTest.xml

  # Reports to GitHub's dependency graph (and so to Dependabot) only what ships: the Android release app, the desktop app, the web
  # library and the Apple framework. Build tooling (Gradle plugins, Android test-device tools) is left out on purpose. Replaces
  # GitHub's automatic dependency submission, which must stay turned off in the repository settings.
  dependency-graph:
    name: Dependency graph (shipped code)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          dependency-graph-include-projects: ':(androidApp|desktopApp|web|apple)'
          dependency-graph-include-configurations: 'releaseRuntimeClasspath|runtimeClasspath|jsRuntimeClasspath|(ios|macos|tvos)Arm64CompileKlibraries'
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '.*'

  windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: ./gradlew jvmTest :desktopApp:classes

  # The packaged desktop app (createDistributable, the installers) runs on jlink's trimmed runtime, not the full JDK that
  # `:desktopApp:run` uses, so these jobs build it, check its JDK modules and start it. No artifacts are uploaded: the installers
  # are large and the repo is public.
  desktop-package-linux:
    name: Desktop package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # suggestRuntimeModules prints jdeps' view of the modules, for comparing with modules(...) in desktopApp/build.gradle.kts.
      - run: ./gradlew :desktopApp:suggestRuntimeModules :desktopApp:createDistributable :desktopApp:packageDeb
      - run: ./scripts/check-desktop-runtime.sh desktopApp/build/compose/binaries/main/app/Current
      - run: dpkg-deb --info desktopApp/build/compose/binaries/main/deb/*.deb
      - name: Start the packaged app (Xvfb)
        run: |
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1600x1000x24 &
          # Start the app only once the display accepts connections.
          for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          DISPLAY=:99 ./scripts/smoke-desktop-app.sh desktopApp/build/compose/binaries/main/app/Current/bin/Current

  desktop-package-windows:
    name: Desktop package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # packageMsi downloads WiX 3.11 itself (the Compose plugin's downloadWix task).
      - run: ./gradlew :desktopApp:createDistributable :desktopApp:packageMsi
      - run: ./scripts/check-desktop-runtime.sh desktopApp/build/compose/binaries/main/app/Current
      - run: ./scripts/smoke-desktop-app.sh desktopApp/build/compose/binaries/main/app/Current/Current.exe
      # Install, upgrade to a newer build and uninstall, per user: the files go to %LOCALAPPDATA%\Current App and the
      # app's data folder (%LOCALAPPDATA%\Current) survives both.
      - name: Install, upgrade and uninstall the MSI
        run: |
          mkdir -p "$RUNNER_TEMP/msi"
          cp desktopApp/build/compose/binaries/main/msi/*.msi "$RUNNER_TEMP/msi/first.msi"
          ./gradlew :desktopApp:packageMsi -Pcurrent.version=0.1.1
          cp desktopApp/build/compose/binaries/main/msi/Current-0.1.1.msi "$RUNNER_TEMP/msi/second.msi"
          ls -l "$RUNNER_TEMP/msi"
          pwsh -NoProfile -File scripts/check-msi-upgrade.ps1 -First "$RUNNER_TEMP/msi/first.msi" -Second "$RUNNER_TEMP/msi/second.msi" -SecondVersion 0.1.1
      - name: jpackage logs (on failure)
        if: failure()
        run: tail -n 60 desktopApp/build/compose/logs/*/*.txt || true

  macos:
    name: Apple apps (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - run: xcodebuild -version
      # Unsigned app builds for iOS simulator, macOS and tvOS simulator. Each one's build phase links the Shared framework for its SDK.
      - run: ./scripts/build-apple-app.sh
