name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tests, web, Android (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webApp/package-lock.json
      - run: ./gradlew jvmTest :desktopApp:classes
      - name: Web app (npm licences, Kotlin library, Vite build)
        working-directory: webApp
        run: |
          npm ci
          npm run licences
          npm run build
      - run: ./gradlew :androidApp:assembleDebug

  windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jvmTest :desktopApp:classes

  macos:
    name: Apple frameworks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :apple:linkDebugFrameworkIosSimulatorArm64 :apple:linkDebugFrameworkMacosArm64 :apple:linkDebugFrameworkTvosSimulatorArm64
