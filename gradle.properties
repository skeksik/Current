#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Current
# The app version: AppInfo (sent to servers), the desktop installers, Android versionName and versionCode. Apple keeps its own
# MARKETING_VERSION in appleApp/Configuration/Config.xcconfig, which scripts/check-apple-version.sh compares with this one.
current.version=0.1.0

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true